spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:mysql://localhost:5432/inventory_db
    username: root
    password: 3092
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: always

server:
  port: 9010
  servlet:
    context-path: /api/v1


